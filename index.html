<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b0d" />
    <meta name="description" content="WasteWise helps you make the right everyday sorting choice." />
    <title>WasteWise — Sort what matters</title>
    <script>
      (function() {
        var q = new URLSearchParams(window.location.search);
        var reduce = q.get('reduce') === '1' || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        if (reduce) {
          document.documentElement.setAttribute('data-motion', 'reduced');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
